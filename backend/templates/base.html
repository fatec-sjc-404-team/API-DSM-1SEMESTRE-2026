<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}API FATEC{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>


    <div style="display: flex;">
        
        <aside class="sidebar">
            <div style="display: flex; margin: 20px; align-items: center; gap: 10px;">
                <img src="{{ url_for('static', filename='images/avocredit-logo.png')}}" alt="avocredit" style="width: 40px;">
                <div>
                    <h3 style="color: rgb(107, 155, 36);">AvoCredit</h3>
                    <p style="color: rgb(59, 59, 59); font-size: small;">Potencial de Crédito</p>
                </div>
            </div>
            <hr style="color: lightgreen; opacity: 0.7;">

        </aside>

        <div style="display: flex; flex-direction: column; flex: 1; overflow-x: hidden;">
            <header>
                <div class="top-header">
                    <div style="justify-content: center;">
                        <h2 style="margin-bottom: 5px;">{% block header_title %}Texto do Header{% endblock %}</h2>
                        <p style="margin-top: 5px;">{% block header_desc %}Descrição do header{% endblock %}</p>
                    </div>

                    <div style="display: flex; align-items: center; gap: 20px; margin-right: 0;">
                        <div>
                            <h4 style="margin-bottom: 5px; opacity: 0.4;">Última atualização:</h4>
                            <p style="margin-top: 5px;"><b>16/10/2026</b></p>
                        </div>

                        <hr class="divisor">
                        
                        <div>
                            <h4 style="margin-bottom: 5px;"><b>Analista de crédito:</b></h4>
                            <p style="margin-top: 5px; opacity: 0.4;">Uso interno</p>
                        </div>
                    </div>
                </div>
            </header>

            <main class="main">
                {% block content %}

                {% endblock %}
            </main>
        </div>
        
    </div>

    
    
</body>
</html>
